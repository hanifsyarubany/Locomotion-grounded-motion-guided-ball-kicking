# Checkpoint sweep: 8 checkpoints at 2000-step spacing, centred on the checkpoint
# previously reported (474000), clamped to this run's available range.
# Report the MEDIAN across these 8, not any single one -- see benchmark_plan.md sec 5.
wandb:
  project: Policy_Evaluation
  group: sim2sim-eval-sweep
  run_name: sweep-unified-2-reanchor
  tags: [checkpoint-sweep]

iterations: 30
max_concurrent_scans: 10

onnx_targets:
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0200000.onnx
    name: u2_200000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0202000.onnx
    name: u2_202000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0204000.onnx
    name: u2_204000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0206000.onnx
    name: u2_206000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0208000.onnx
    name: u2_208000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0210000.onnx
    name: u2_210000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0212000.onnx
    name: u2_212000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260908_155504-distill-2skills-1216-distill/model_0214000.onnx
    name: u2_214000
    kick_aim_enabled: true

evaluations:
  - type: kick_survival
    num_trials: 10
    success_sigma_m: [0.5, 1.0]
    ball_pos_randomization: [0.1, 0.1]
    # 2026-09-12: re-anchor the ball to the robot's ACTUAL pose at the kick trigger instead of
    # leaving it at the world point it was spawned at before the 1.5s settle (during which the
    # robot drifts ~4.2cm backward, measured). Required for Table VII: its teacher, N=2, N=4,
    # N=6 and N=7 columns must all be measured under the SAME placement protocol or the
    # specialist-vs-unified deltas mix two conventions. See sweep-unified-7-reanchor.yaml.
    reanchor_ball_at_trigger: true
