# Checkpoint sweep, unified N=7 distillation.
#
# 16 checkpoints spanning 387k-444k. Composition:
#   * 8 operator-selected checkpoints (marked "operator pick") -- all retained.
#   * 440000, the checkpoint every number currently in the paper came from,
#     added so the reported figure can be located within the distribution.
#   * neighbours around each selected cluster, and 8k-spaced bridge points
#     across the 390k-430k gap, so the sample is not bimodal.
#
# Report the MEDIAN across all 16, not any single checkpoint (benchmark_plan.md sec 5).
# NOTE ON BIAS: a median only removes selection bias if the checkpoints were not
# chosen by looking at performance. If the operator picks were performance-informed,
# report the bridge/neighbour subset separately as the unbiased estimate.
wandb:
  project: Policy_Evaluation
  group: sim2sim-eval-sweep
  run_name: sweep-unified-7
  tags: [checkpoint-sweep]

iterations: 25
max_concurrent_scans: 10

onnx_targets:
  - path: logs/UnifiedBallKickingEnhanced/20260907_100900-distill-7skills-12161718192011-distill/model_0387000.onnx
    name: u7_387000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_100900-distill-7skills-12161718192011-distill/model_0389000.onnx
    name: u7_389000   # <- operator pick
