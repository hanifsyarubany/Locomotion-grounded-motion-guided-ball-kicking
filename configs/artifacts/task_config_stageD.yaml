# ==============================================================================
# Stage D v1 (2026-08-09, boundary settled 2026-08-10 after three iterations):
# post-swing -> locomotion handoff.
#
# Same reward mechanism as Stage C1 (every field/weight below is copied verbatim
# from task_config_stageC1.yaml) -- Stage D is NOT a reward-curriculum step like
# B->C1->C2. It's a targeted mechanism swap for the boundary where the WHOLE
# authored/raw clip ends: the instant a kick-mode env's motion crosses
# pre_recovery_motion_end_idx (approach + strike + the actor's own captured
# post-kick follow-through all done -- BEFORE the synthetic recovery-transition
# + static-hold tail that gets appended after it), UnifiedManager flips that
# env's task_mode from KICK to LOCOMOTION and pins its velocity command to exact
# zero for the rest of the episode (see
# UnifiedManager._maybe_flip_kick_recovery_to_locomotion / LocomotionCommand.
# pin_zero). Because task_mode already drives both the task_mode_onehot
# observation and every reward/termination term's task_mode_mask gating, this
# reuses the existing locomotion reward (alive, tracking_lin_vel/ang_vel,
# standard posture/safety) wholesale once it takes over -- no new reward terms,
# no observation-width change.
#
# **2026-08-13 SYNC**: this file had drifted stale relative to task_config_
# stageC1.yaml (missing the 2026-08-12 three flip-fixes, the kick_penalty_
# unstable/kick_no_fly retunes, motion_strike_dof_pos_error_exp, and current
# deadzone values) -- resynced verbatim from C1's live content below. Read
# task_config_stageC1.yaml directly if this drifts again; that file is the one
# actually launched from (HOLOSOMA_TASK_CONFIG), this one mirrors it plus the
# Stage-D/handoff-specific fields documented in this header.
#
# v1 scope, deliberately: no randomized walking after the flip -- the command
# stays pinned at deterministic zero for the whole episode. Resume this stage
# from a current Stage C1/C2 checkpoint, same warm-start pattern as every prior
# stage transition -- launch with the g1_29dof_unified_fast_sac_stageD
# experiment preset (config_values/unified/g1/experiment.py), which doubles
# max_episode_length_s (20.0s -> 40.0s) so there's a meaningful window to
# actually hold the post-flip zero-velocity stand, since task_config_stageC1.
# yaml/*C2.yaml cannot set this field at all (it's a SimEngineConfig field, not
# MultiSkillConfig/yaml-driven -- see that preset's own comment).
#
# ------------------------------------------------------------------------------
# LOCOMOTION -> KICK direction (the mirror of the flip above), 2026-08-13.
# Full design: https://claude.ai/code/artifact/53c1da51-d841-4979-8bf8-efd5ea652e06
# and memory locomotion_to_kick_handoff_design_settled.md (decisions D1-D8).
#
# **2026-08-13: ALL FOUR INCREMENTS IMPLEMENTED, OFFLINE-TESTED (849 passed,
# same 2 pre-existing unrelated failures throughout this whole file's history),
# AND LIVE-VERIFIED on real IsaacSim (GPU 2, 64 envs, skills1.yaml).**
#
# 1. Reference re-anchoring (MotionCommand.enter_at_frame +
#    _apply_ref_anchor_pos/_rot/_vec) -- exact 0.0m position match at the
#    anchored entry tick, zero cross-env leakage.
# 2. The handoff mechanism -- entry-point search (_build_entry_search_table/
#    search_entry_point, skill-constrained per D2), ball placement at handoff
#    (ball_rel_at_frame/place_ball_at_entry), the turning-point fire/decline
#    decision (UnifiedManager._maybe_enter_kick_from_locomotion, D3), the
#    decel-and-retry fallback (LocomotionCommand.pin/unpin, D8), the reward
#    ramp (kick_scale_wrappers._pre_kick_reward_ramp_multiplier) and
#    termination grace (managers/termination/terms/locomotion._pre_kick_grace_
#    active + wbt.BadTracking's pre_kick_grace_steps param). Live: 21-25/64
#    envs fired within 40 ticks under zero actions; D8 fallback separately
#    verified (26 envs entered it, 11 correctly declined via timeout).
# 3. Reference-side blend (MotionCommand.capture_ref_blend/_apply_ref_blend,
#    pre_kick_reference_blend_steps) -- blends the 4 relative-body targets
#    (motion_relative_body_position/_orientation_error_exp, motion_global_
#    body_lin_vel/_ang_vel) from the robot's own captured pose toward the
#    clip's raw target, instead of an instant snap. Live: at-fire error vs the
#    robot's live pose exactly 0.0m/0.0m/s, quat dot 1.0; ratio measurably
#    progresses afterward (0.95 by ~16 ticks post-fire in a 20-tick window).
# 4. Fixed ball + geometry-aware search (mid_episode_kick_entry_ball_fixed,
#    D2b -- closes the "ball doesn't move at deploy" training-scaffold gap):
#    ball placed ONCE at reset (MotionCommand.place_ball_at_reset_pending,
#    anchored to the clip's own frame-0 pose, not the robot's), never moved
#    again at fire; the entry search gains 2 ball-geometry columns (7 total,
#    pooled-z-scored with the 5 gait ones). Live: table confirmed 7-wide,
#    ball_spawn_pos_w drift across a fire tick exactly 0.0m (place_ball_at_
#    entry correctly skipped).
#
# All 10 fields below are wired end-to-end (MultiSkillConfig -> command_cfg
# [-> MotionConfig for the 2 setup-time fields] -> UnifiedManager/reward.py/
# termination.py, same direct-read pattern as kick_recovery_locomotion_flip_
# enabled) and validated at load time. Full design:
# https://claude.ai/code/artifact/53c1da51-d841-4979-8bf8-efd5ea652e06 and
# memory locomotion_to_kick_handoff_design_settled.md (decisions D1-D8).
#
# ******************************************************************************
# RUN-1 LAUNCH VALUES (2026-08-13) -- first real training run of this mechanism.
# Everything ABOVE this block is byte-identical to task_config_stageC1.yaml
# (verified field-by-field, not assumed) so this run differs from the live C1
# baseline in EXACTLY the handoff mechanism and nothing else.
#
# mid_episode_kick_entry_prob 0.3 -- top of D6's recommended 0.2-0.3 opening
#   range. D6's own stated reason for the cap (walk-in envs bypass reset()'s
#   critical_frame_oversampling_prob, MEASURED to shrink the swing-error tail,
#   peak 1.25 vs 3.43) is actually MOOT here: that field is 0.0 in C1, so
#   nothing is being bypassed. The cap is kept anyway for the independent
#   reason that this mechanism has never been trained with -- at 0.3, ~70% of
#   kick-partitioned envs keep the validated teleport-at-reset path, so the
#   proven data stream stays the majority and holds the policy together if
#   walk-in destabilizes.
#
# min_steps 100 -- 2.0s at 50Hz before the search is even attempted; the robot
#   settles into a genuine steady-state gait first. Cheap against this preset's
#   40s (2000-tick) episodes.
#
# max_residual 2.0 -- ABORT ceiling, NOT a fire threshold (D3: firing is at the
#   residual turning point). Measured NN residual is median 0.84 sigma and FLAT
#   across forward speed (0.74 @ vx=0 -> 0.90 @ vx=1.0), so 2.0 is ~2.4x the
#   median: the common case fires, only the genuinely uncovered tail declines.
#   THIS IS THE LEAST-EVIDENCED VALUE HERE -- that residual distribution was
#   measured over CLIP content, not over the live policy's real walking states
#   under randomized lateral/yaw commands. Watch the decline rate; if envs are
#   declining often, loosen this before touching anything else.
#
# pre_kick_decel_* / fallback_timeout ALL 0.0 -- D8's decel-and-retry fallback
#   deliberately OFF for run 1. It is only load-bearing under increment 4's
#   fixed ball (which is also off, below), and it adds command-pinning that
#   interacts with locomotion training. One variable at a time; turn it on in
#   run 2 if the ceiling above declines more than expected.
#
# reward_ramp / termination_grace 50.0 -- exact mirrors of the LIVE, already-
#   validated post_flip_reward_decay_steps / post_flip_termination_grace_steps
#   (both 50.0 above, Stage D's own 2026-08-12 flip-fixes). D5 checked 50-tick
#   ramps against the Stage-D-overlap gap (clip_T - entry_frame): min 130 ticks
#   for video_012, the only skill in skills1.yaml -- comfortably clear.
#
# reference_blend 50.0 -- matched to the reward ramp on purpose: the target
#   finishes gliding onto the clip exactly as the reward reaches full strength,
#   so the policy is never asked at full weight for a pose it is still being
#   eased toward. No independent evidence for this length beyond that coherence
#   argument (increment 3 has no post-flip counterpart to mirror).
#
# ball_fixed FALSE -- D2's training scaffold (ball placed AT the handoff), not
#   increment 4's deploy-faithful fixed ball. Deliberate: with a fixed ball the
#   robot must walk into a +/-0.1m box at a specific bearing to be in the kick
#   policy's trained distribution, which D2b's own measurement says "would have
#   produced almost no usable data." Fixed-ball is a LATER run, after walk-in
#   itself is shown to train.
#
# GUARD METRICS (same discipline as the stability-block retune): kick_ball_
#   hit_rate (0.374 on the live C1 baseline) MUST NOT drop -- abort condition.
#   kick_topple_frac (0.067) should not rise. Watch kick_early_term_frac
#   (0.946) too: it is already the dominant failure mode and walk-in entries
#   are the states most likely to add bad_tracking terminations.
# ******************************************************************************
mid_episode_kick_entry_prob: 0.3
mid_episode_kick_entry_min_steps: 100
mid_episode_kick_entry_max_residual: 2.0
pre_kick_decel_steps: 0.0
pre_kick_decel_target: 0.1
pre_kick_fallback_timeout_steps: 0.0
pre_kick_reward_ramp_steps: 50.0
pre_kick_termination_grace_steps: 50.0
pre_kick_reference_blend_steps: 50.0
mid_episode_kick_entry_ball_fixed: false
# ==============================================================================

