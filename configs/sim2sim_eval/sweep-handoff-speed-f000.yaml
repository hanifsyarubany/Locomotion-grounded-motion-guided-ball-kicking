# Table VIII (handoff robustness) checkpoint sweep, unified N=7 distillation.
#
# Same 16 checkpoints as sweep-unified-7.yaml (387k-444k, 8 operator picks + bridge/neighbour
# points -- see that file's own header for the selection rationale), so every Table VIII number
# comes from the same evaluated model identity as Tables V/VI/VII's shooting numbers.
#
# This file is DELIBERATELY LIGHT -- it covers only rows 2 and 4 of Table VIII:
#   - Kick->Loco, random tick            -> kick_to_loco_flip's alive_rate
#   - Loco->Kick, random in-motion state -> loco_to_kick_handoff's fall_rate/hit_rate
#
# Rows 1 and 3 need NO new config at all:
#   - Loco->Kick, from v~=0 state   -> kick_survival's own fall_rate/hit_rate (the settle phase
#     before [TRIGGER_KICK] already IS a v~=0 entry -- intentional reuse of the same number
#     already reported for Tables V/VI/VII, confirmed with the operator 2026-09-09, not an
#     independent measurement).
#   - Kick->Loco, end of authored clip -> kick_survival's NEW handoff_reached_rate/
#     post_handoff_alive_rate (added 2026-09-09, see mujoco_kick_survival_scan.py's own docstring
#     on handoff_tick/post_handoff_fall_step). The auto-return already happens inside that scan's
#     existing hold window (UnifiedLocoKickPolicy._return_to_loco() fires on its own at the clip's
#     natural end); the code change that isolates it is fully additive, so RE-RUNNING
#     sweep-unified-7.yaml UNCHANGED now also produces these two fields for free -- no reason to
#     duplicate that (expensive) eval type's cost in this file too.
#
# num_trials=32/iterations=5 -> 160 attempts per checkpoint. NOT sweep-unified-7's 250: raised
# from an initial 32 (iterations=1) after checking the actual statistics, not just cost --
# 95% CI on a single checkpoint's own reading (worst-case p=0.5) is +/-17.3 points at n=32 vs
# +/-6.2 points at n=250. That gap matters specifically because this table's protection against
# checkpoint-lottery IS the median over these 16 checkpoints -- if any one checkpoint's own
# reading is that noisy, two genuinely different checkpoints can swap rank order from sampling
# noise alone, which is the same failure mode the sweep exists to catch, reintroduced one level
# down. 160 (+/-7.7 points) trades most of that gap away without paying full parity with
# sweep-unified-7's budget -- kick_to_loco_flip/loco_to_kick_handoff trials are each individually
# more expensive (a settle + a multi-second random walk or in-progress kick before the flip) than
# a kick_survival trial, so matching 250 outright was judged not worth the extra wall-clock here.
# Raise further (add iterations, or num_trials) if the resulting spread still looks too coarse
# once real numbers are in.
wandb:
  project: Policy_Evaluation
  group: sim2sim-eval-sweep
  run_name: sweep-handoff-speed-f000
  tags: [checkpoint-sweep, handoff]

