evaluations:
  # -> Table VIII row "Kick->Loco, random tick". Plain (unsplit) mode, matching the paper's own
  # description ("triggered at an arbitrary tick, including inside the strike window") -- NOT
  # split_by_strike_phase (that variant is Table XI's own strike-vs-nonstrike comparison, a
  # different question). flip_delay_min/max_steps left at the worker's own defaults (10/60 ticks),
  # mirroring training's own kick_abort_prob window -- see mujoco_kick_loco_flip_scan.py's own
  # docstring for why that window, not an eval-invented one.
  - type: kick_to_loco_flip
    num_trials: 32
    timeout_s: 300.0

  # -> Table VIII row "Loco->Kick, from random in-motion state". Worker defaults for the walk
  # window (2-3s) and post-flip hold (8s). ball_pos_randomization matches sweep-unified-7.yaml's
  # own kick_survival value (the settled-state row's source) -- added 2026-09-09 after the first
  # pass of this table showed a 100.0% in-motion hit rate against 91.5% settled-state: the two
  # scans were placing the ball differently (settled = jittered fixed world spot; in-motion =
  # EXACT robot-relative nominal, no jitter, by original design -- see
  # mujoco_loco_to_kick_handoff_scan.py's own docstring on why the ball is parked away from a
  # walking robot). That exact-placement choice is still correct for measuring whether the
  # handoff ITSELF survives, but it made the two hit rates non-comparable for Table VIII's
  # side-by-side reading. Matching the jitter here (applied in the robot's own frame -- see
  # --ball-pos-randomization-x/-y's own help text) makes the comparison fair without touching what
  # the settled-state row measures.
  - type: loco_to_kick_handoff
    num_trials: 32
    timeout_s: 300.0
    ball_pos_randomization: [0.1, 0.1]
