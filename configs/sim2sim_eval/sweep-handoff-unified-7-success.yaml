evaluations:
  # -> Table VIII row "Loco->Kick, from random in-motion state", now scored on AIM as well as
  # contact (2026-09-12). Only this eval type is present: the two Kick->Loco rows are scored on
  # survival alone and are unaffected by this change, so re-running them would burn compute to
  # reproduce numbers that cannot move.
  #
  # WHY SUCCESS, AND WHY THETA. Contact saturates on most skills (near 100%), so a hit-rate-only
  # row cannot show the tradeoff this measurement exists to test: entering the kick while still
  # carrying real momentum may strike the ball just as reliably yet AIM it worse. Both values
  # below are deliberately identical to the settled row's own sweep (sweep-unified-7-reanchor.yaml
  # kick_survival: success_sigma_m [0.5, 1.0], and the +/-15 deg aim range that sweep's worker
  # defaults to), because the two rows are read side by side in the paper. The worker used to
  # hardcode theta = 0.0, which is the easy centred-aim case; scoring success at 0.0 against a
  # settled row swept over +/-15 would hand this row an advantage that has nothing to do with the
  # handoff.
  - type: loco_to_kick_handoff
    num_trials: 32
    timeout_s: 300.0
    ball_pos_randomization: [0.1, 0.1]
    kick_aim_theta_max_deg: 15.0
    success_sigma_m: [0.5, 1.0]
