# Checkpoint sweep: 8 checkpoints at 2000-step spacing, centred on the checkpoint
# previously reported (474000), clamped to this run's available range.
# Report the MEDIAN across these 8, not any single one -- see benchmark_plan.md sec 5.
wandb:
  project: Policy_Evaluation
  group: sim2sim-eval-sweep
  run_name: sweep-unified-6-reanchor
  tags: [checkpoint-sweep]

iterations: 30
max_concurrent_scans: 10

onnx_targets:
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0467000.onnx
    name: u6_467000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0469000.onnx
    name: u6_469000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0471000.onnx
    name: u6_471000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0473000.onnx
    name: u6_473000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0475000.onnx
    name: u6_475000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0477000.onnx
    name: u6_477000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260907_101005-distill-6skills-121617181920-distill/model_0479000.onnx
