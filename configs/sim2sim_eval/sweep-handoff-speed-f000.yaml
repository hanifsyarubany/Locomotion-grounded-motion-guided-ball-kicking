evaluations:
  # ENTRY-SPEED SWEEP arm f=0: the whole walk-command envelope scaled to 0 of this
  # project's own G1 locomotion training range. f=1.0 reproduces the standard in-motion row.
  #
  # QUESTION. The in-motion row scores ~1.8 points HIGHER on success than the settled row, on
  # 14 of 16 checkpoints (sign test p=0.004). Two explanations survive: (a) carrying velocity
  # into the strike genuinely helps, or (b) the advantage has nothing to do with speed and comes
  # from something else that differs between the two harnesses, e.g. the gait phase the trigger
  # lands on, since a walking robot triggers at a random phase while a settled one does not.
  #
  # THE f=0.0 ARM IS THE CONTROL, and is the reason this sweep can answer that. It runs THIS
  # scan (same ball placement, same +/-15 deg aim sweep, same reached-handoff denominator) with a
  # zero velocity command, so the robot holds still through the walk window. If f=0.0 falls back
  # to the settled row's ~15.4, the advantage is velocity and should rise with f. If f=0.0
  # already sits near 16.6, velocity is NOT the cause and the difference lives in the harness.
  # Reading the trend without this arm would confound the two.
  - type: loco_to_kick_handoff
    num_trials: 32
    timeout_s: 300.0
    ball_pos_randomization: [0.1, 0.1]
    kick_aim_theta_max_deg: 15.0
    success_sigma_m: [0.5, 1.0]
    lin_vel_x_range: [-0, 0]
    lin_vel_y_range: [-0, 0]
    ang_vel_yaw_range: [-0, 0]
