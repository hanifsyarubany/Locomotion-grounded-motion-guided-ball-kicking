# ==============================================================================
# DRAFT / FOR DISCUSSION -- not yet consumed by any code path.
#
# Proposed "skills" file: ONLY the lego-like motion_skill_N blocks, and ONLY the
# fields that are genuinely per-clip content (which clip, where it's spawned/
# aimed, which frames bound the strike, how much of training it gets, which foot
# kicks). Everything tunable (randomization ranges, success radius, per-category
# reward scales, timing/observation misc) lives once in task_config.example.yaml
# instead of being repeated -- usually identically -- on every skill block.
#
# Add a new skill by adding a new motion_skill_N block -- no other file needs to
# change. All 9 fields below are required; there are no optional/defaulted fields
# left in this file (the ones that had defaults all moved to task_config).
#
# 2026-08-14: base_robot + each skill's own task_config field are now live (holosoma/__init__.py
# derives HOLOSOMA_TASK_CONFIG from task_config below when it isn't set explicitly -- an explicit
# export always wins, so every existing launch command that already sets HOLOSOMA_TASK_CONFIG is
# completely unaffected). base_robot's values below are the pre-existing hardcoded defaults
# (config_values/unified/g1/reward.py) -- a byte-identical no-op until you actually change them.
# ==============================================================================
base_robot:
  target_height: 0.74 # previously 0.76 ->recommend 0.742
  deadzone: 0.015

motion_skill_1:
  motion_npz: ../../locomotion_and_motion_tracking/video2robot/data/video_013/npz_holosoma/robot_motion_track_1.npz
  x: 1.99
  y: -0.14
  # 2026-08-22: CALIBRATED, not authored -- see scripts/calibrate_nominal_bearing.py. The
  # original target_x=3.99/target_y=-0.14 (bearing 0.0 deg, dead straight) was never measured
  # against this clip's real contact physics. A real MuJoCo rollout of this skill's own trained
  # Stage B checkpoint (2026-08-22 run, model_0400000.onnx) shows the ball actually departs at
  # -3.50 deg (a mild lean to the robot's RIGHT, the smallest of the three calibrated skills --
  # consistent with this skill's ball spawning closest to the foot's natural contact point).
  # target_x/target_y below encode that measured bearing at D=5.0m
  # (kick_aim_nominal_distance_m's default).
  # target_x: 6.981
  # target_y: -0.445
  target_x: 6.579
  target_y: -2.782
  strike_start_frame: 153   # auto-estimate, T=250 @ 50fps -- verify visually
  stand_start_frame:  220    # auto-estimate, T=250 @ 50fps
  motion_training_ratio: 0.90
  kick_foot: right
  kick_ankle_pitch_correction_enabled: true  # 2026-08-08: self-calibrating strike-window ankle-pitch fix, see kick_ankle_pitch_correction.py
  kick_aim_enabled: true
  task_config: task_config_stageC1-skill013
