evaluations:
  # 2026-09-12: MATCHED COMPARISON for Table XI(b)'s live-donor column. That ablation measures
  # strike/alive_rate (kick_to_loco_flip, split_by_strike_phase: true) on a Stage-B skill_7
  # specialist, 250k-300k, and got 81.8%. Table VIII's own "Kick->Loco, random tick" row measures
  # the SAME eval type on the DEPLOYED unified N=7 checkpoints, 387k-444k, but UNSPLIT (pools
  # strike+nonstrike together) and got 100.0% -- three things differ at once (specialist vs
  # library, split vs pooled, 250-300k vs 387-444k), so the two numbers were never comparable, and
  # the paper's caption now says so explicitly rather than implying they are.
  #
  # This config isolates ONE of those three differences by holding the other two fixed: same 16
  # checkpoints and same eval type as sweep-handoff-unified-7.yaml, just with split_by_strike_phase
  # added. That leaves "Stage-B specialist vs deployed library" as the only remaining difference
  # from the ablation's 81.8%, which is exactly the question the operator asked -- does the
  # library's strike-window recovery look like the ablation's specialist, or does the 100.0%
  # Table VIII already reports actually hold up inside the strike window too.
  #
  # Cost: split_by_strike_phase runs the SAME scan up to 3x (strike + up to 2 nonstrike
  # sub-windows), pooled into strike/nonstrike -- ~2x the unsplit trial count overall (see
  # _run_kick_to_loco_flip_split_by_strike_phase's own docstring). iterations=5/num_trials=32
  # matches sweep-handoff-unified-7.yaml's own sizing exactly (that file's own header derives
  # +/-7.7pt 95% CI per checkpoint at this budget), so strike/alive_rate here carries the same
  # per-checkpoint precision Table VIII's own random-tick row already reports at.
  - type: kick_to_loco_flip
    split_by_strike_phase: true
    num_trials: 32
    timeout_s: 300.0
