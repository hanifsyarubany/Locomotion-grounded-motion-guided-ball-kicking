evaluations:
  # track_posture_metrics is the whole point of this file -- it adds the 12
  # posture_{term}_{early,late} keys. fall_rate/hit_rate/handoff_* come back too at no extra cost
  # (same rollout), which is useful as a cross-check that the arms really are matched on survival
  # while differing on stance.
  - type: kick_survival
    num_trials: 16
    track_posture_metrics: true
    ball_pos_randomization: [0.1, 0.1]
    timeout_s: 900.0
