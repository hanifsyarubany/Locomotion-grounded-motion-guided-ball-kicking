# ==============================================================================
# Distillation env config for distill_specialists.py: skill 1 (video_012, task_config_stageC1
# specialist, `model_0400000.pt`) + skill 2 (video_011, task_config_stageC1 specialist,
# `model_0450000.pt`).
#
# Each motion_skill_N block below is copied VERBATIM from that skill's own configs/skillN.yaml as
# of 2026-08-17 -- motion_npz/x/y/target_x/target_y/strike_start_frame/stand_start_frame/
# kick_ankle_pitch_correction_enabled/task_config MUST match what each skill's teacher actually
# trained with, or that teacher gets queried on out-of-distribution references with no error
# raised (see distill_specialists.py's own module docstring, point 2). Re-diff against
# skill1.yaml/skill2.yaml before using this file if either has changed since.
#
# motion_training_ratio below is NOT used by distill_specialists.py (it drives env.step's own
# reward-side RL training ratio, irrelevant to pure supervised regression) but IS still consumed
# by _build_task_mode_partition to decide what fraction of envs get dedicated to each skill during
# rollout -- kept at 0.45/0.45 (vs. either skill's own training-time 0.9) for balanced state
# coverage of BOTH skills during distillation, leaving 0.10 to locomotion.
#
# teacher_checkpoint (2026-08-17): distillation-only field, read directly by
# distill_specialists.py's parse_teacher_ckpts_from_skills_yaml -- NOT part of MultiSkillConfig/
# SkillConfig, so it's silently ignored by every other consumer of this file (RL training, etc.).
#
# 2026-08-17 20:xx: skill 2's teacher_checkpoint upgraded from the Stage B bootstrap
# (20260816_211135, model_0250000.pt) to the now-FINISHED Stage C specialist
# (20260817_115256-stageC-skill2-bad=025-ankle=true-locomotion, model_0450000.pt) -- Stage B has
# every kick_ball_* reward term hardcoded to 0.0 (configs/task_config_stageB.yaml), so a Stage-B
# teacher has ball_hit_rate/ball_success_rate == 0.0000 for its ENTIRE training (confirmed directly
# from its own tfevents), i.e. it never learned to kick at all -- distilling from it can only ever
# produce a student with the same. The new Stage C checkpoint's own final numbers (avg over its
# last 5k steps): kick_topple_frac 0.090, kick_ball_hit_rate 0.531, kick_ball_success_rate 0.044 --
# a real specialist, comparable to (slightly better than) skill 1's own teacher. task_config below
# updated stageB -> stageC1 to match what this checkpoint actually trained under.
# ==============================================================================
task_config: task_config_stageC1

base_robot:
  target_height: 0.76
  deadzone: 0.015

motion_skill_1:
  motion_npz: ../../locomotion_and_motion_tracking/video2robot/data/video_012/npz_holosoma/robot_motion_track_1.npz
  x: 1.39
  y: 0.02
  # 2026-08-22: CALIBRATED against a real MuJoCo rollout of this exact (x,y) spawn's own
  # trained Stage B checkpoint (skill_012 Stage B checkpoint (model_0350000.onnx)) -- see scripts/calibrate_nominal_bearing.py.
  # Real measured departure bearing: -16.91 deg. target_x/target_y below encode that
  # bearing at D=5.0m (kick_aim_nominal_distance_m's default) -- NOT the original authored
  # value, which was never measured against real contact physics.
  target_x: 6.174
  target_y: -1.434
  strike_start_frame: 120
  stand_start_frame: 154
  motion_training_ratio: 0.45
  kick_foot: right
  kick_aim_enabled: true
  kick_ankle_pitch_correction_enabled: true
  task_config: task_config_stageC1
  teacher_checkpoint: logs/RoboNaldoBallKicking/20260814_021015-stageC-1skill-locoflip-shooting05-new-fixes-4-locomotion/model_0400000.pt

motion_skill_2:
  motion_npz: ../../locomotion_and_motion_tracking/video2robot/data/video_011/npz_holosoma/robot_motion_track_1.npz
  x: 1.3
  y: -0.06
  # 2026-08-22: CALIBRATED against a real MuJoCo rollout of this exact (x,y) spawn's own
  # trained Stage B checkpoint (stageB-skill2 Stage B checkpoint (model_0165000.onnx)) -- see scripts/calibrate_nominal_bearing.py.
  # Real measured departure bearing: +41.35 deg. target_x/target_y below encode that
  # bearing at D=5.0m (kick_aim_nominal_distance_m's default) -- NOT the original authored
  # value, which was never measured against real contact physics.
  target_x: 5.053
  target_y: 3.243
  strike_start_frame: 170
  stand_start_frame: 215
  motion_training_ratio: 0.45
  kick_foot: right
  kick_aim_enabled: true
  kick_ankle_pitch_correction_enabled: true
  task_config: task_config_stageC1
  teacher_checkpoint: logs/RoboNaldoBallKicking/20260817_115256-stageC-skill2-bad=025-ankle=true-locomotion/model_0450000.pt
