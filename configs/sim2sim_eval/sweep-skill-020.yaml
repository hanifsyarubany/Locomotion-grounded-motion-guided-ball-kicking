# Checkpoint sweep: 8 checkpoints at 2000-step spacing, centred on the checkpoint
# previously reported (366000), clamped to this run's available range.
# Report the MEDIAN across these 8, not any single one -- see benchmark_plan.md sec 5.
wandb:
  project: Policy_Evaluation
  group: sim2sim-eval-sweep
  run_name: sweep-skill-020
  tags: [checkpoint-sweep]

iterations: 30
max_concurrent_scans: 10

onnx_targets:
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0360000.onnx
    name: s020_360000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0362000.onnx
    name: s020_362000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0364000.onnx
    name: s020_364000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0366000.onnx
    name: s020_366000   # <- previously reported
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0368000.onnx
    name: s020_368000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0370000.onnx
    name: s020_370000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0372000.onnx
    name: s020_372000
    kick_aim_enabled: true
  - path: logs/UnifiedBallKickingEnhanced/20260903_020808-stageC-skill020-h074-locomotion/model_0374000.onnx
    name: s020_374000
    kick_aim_enabled: true

